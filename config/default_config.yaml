# ====== 数据配置 ======
data:
  # 原始 VisDrone 数据集路径
  train_root: "D:/Data/VisDrone/train"
  val_root: "D:/Data/VisDrone/val"
  test_root: "D:/Data/VisDrone/test-dev"
  # 图像 / 标注子目录名
  image_dir: "images"
  annotation_dir: "annotations"
  # 输出数据集根目录（转换后 YOLO 格式）
  output_base: "./datasets/visdrone"
  # 类别配置
  nc: 10
  names: ["pedestrian", "people", "bicycle", "car", "van", "truck", "tricycle", "awning-tricycle", "bus", "motor"]
  # 从训练集切分验证集比例（0=使用官方 val_root；>0 时忽略 val_root 从训练集切分）
  val_split_ratio: 0.0

# ====== 模型配置 ======
model:
  name: "yolov8n"               # yolov8n | yolov8n-p2
  pretrained: "yolov8n.pt"      # 预训练权重路径或名称（None=随机初始化）
  imgsz: 640
  nc: 10
  # 小目标优化（Should，默认关闭）
  p2_head: false

# ====== 增强配置 ======
aug:
  mosaic: true                  # Mosaic 增强（4 张拼接）
  flip_prob: 0.5                # 水平翻转概率
  hsv_h: 0.015                  # HSV-H 色调抖动
  hsv_s: 0.7                    # HSV-S 饱和度抖动
  hsv_v: 0.4                    # HSV-V 明度抖动
  close_mosaic: 10              # 最后 N 个 epoch 关闭 Mosaic
  multiscale: false             # 多尺度训练（Should，默认关闭）
  # multiscale_range: [0.5, 1.5]  # 多尺度范围（320~960）

# ====== 训练配置 ======
train:
  batch_size: 4
  accumulation_steps: 2         # 梯度累积（有效 batch = batch_size × accumulation_steps）
  epochs: 5
  amp: true                     # 混合精度训练
  # 优化器
  lr0: 0.01                     # 初始学习率
  lrf: 0.01                     # 最终学习率因子（lr_final = lr0 × lrf）
  momentum: 0.937
  weight_decay: 0.0005
  optimizer: "AdamW"
  # 正则化与早停
  dropout: 0.0                  # 分类头 Dropout（0=关闭；过拟合时建议 0.1~0.2）
  early_stop_patience: 15       # 早停耐心值（0=不启用）
  # 多尺度训练开关（Should，默认关闭，不启用不影响基础训练）
  multiscale: false
  # 输出
  output_dir: "./runs/train"
  name: ""                      # 实验名称（空=自动时间戳）

# ====== 系统配置 ======
system:
  gpu_memory_fraction: 0.75     # 进程可用显存比例上限
  num_workers: 1
  pin_memory: false
  seed: 42

# ====== 推理配置 ======
inference:
  conf_threshold: 0.25          # 全局置信度阈值
  iou_threshold: 0.45           # NMS IoU 阈值
  sahi_enabled: false           # SAHI 切片推理（Should，默认关闭）
  sahi_slice_size: 640
  sahi_overlap: 0.2
  sahi_batch_size: 4

# ====== 部署配置 ======
export:
  format: "onnx"                # onnx | engine
  quantize: "fp32"              # fp32（Pascal 不支持 FP16 Tensor Core）
  dynamic_batch: true
  calib_dataset: ""             # 量化校准数据集（仅 fp16/int8 时需要）
  opset: 12                     # ONNX opset 版本
